{{ define "error_page" }}
{{ template "header" . }}
<section class="surface mx-auto max-w-lg p-8 text-center sm:p-10">
  <p class="text-5xl font-bold text-primary-500">{{ .Status }}</p>
  <h1 class="mt-3 text-2xl font-semibold">{{ .Title }}</h1>
  <p class="mt-2 text-muted">{{ .Message }}</p>
  <a href="/" class="btn btn-primary mt-6"><i class="bi bi-house-fill" aria-hidden="true"></i> Back to search</a>
</section>
{{ template "footer" . }}
{{ end }}
